<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hometrainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Condensed:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script type="module" src="js/app.js"></script>
</head>
<body>
<div class="track"></div>
<header>
  <h1>Hometrainer</h1>
  <label class="weight">Poids <input id="weight" type="number" min="20" max="200" step="0.1" inputmode="decimal"> kg</label>
  <span id="status">Pas connecté</span>
</header>

<main>
  <section id="live">
    <p class="label">Puissance (moyenne sur 3 s)</p>
    <div class="power">
      <output id="power">0</output><span>W</span><span class="wkg"><output id="wkg">?</output> W/kg</span>
    </div>
    <dl class="stats four">
      <div><dt>Vitesse</dt><dd><output id="speed">0,0</output><small>km/h</small></dd></div>
      <div><dt>Cadence</dt><dd><output id="cadence">0</output><small>rpm</small></dd></div>
      <div><dt>Distance</dt><dd><output id="distance">0,00</output><small>km</small></dd></div>
      <div><dt>Durée</dt><dd><output id="duration">0:00:00</output></dd></div>
    </dl>
    <canvas id="live-chart" class="live-chart" aria-label="Puissance des 10 dernières minutes"></canvas>
  </section>

  <section id="summary" hidden>
    <p class="label">Puissance moyenne</p>
    <div class="power">
      <output id="s-power"></output><span>W</span><span class="wkg"><output id="s-wkg"></output> W/kg</span>
    </div>
    <dl class="stats three">
      <div><dt>Durée</dt><dd><output id="s-duration"></output></dd></div>
      <div><dt>Distance</dt><dd><output id="s-distance"></output><small>km</small></dd></div>
      <div><dt>Vitesse moyenne</dt><dd><output id="s-speed"></output><small>km/h</small></dd></div>
      <div><dt>Cadence moyenne</dt><dd><output id="s-cadence"></output><small>rpm</small></dd></div>
      <div><dt>Puissance max</dt><dd><output id="s-max"></output><small>W</small></dd></div>
      <div><dt>Énergie</dt><dd><output id="s-energy"></output><small>kJ ≈ kcal</small></dd></div>
    </dl>
    <p id="curve-label" class="label curve-label">Meilleurs efforts</p>
    <canvas id="curve-chart" class="curve-chart" aria-label="Meilleure puissance moyenne sur 5 s, 15 s, 1 min, 5 min, 10 min et 20 min"></canvas>
  </section>

  <p id="message"></p>

  <div class="actions">
    <button id="connect">Connecter le home-trainer</button>
    <button id="stop" hidden>Terminer la séance</button>
    <button id="png" hidden>Télécharger l'image</button>
    <button id="tcx" class="secondary" hidden>Fichier pour Strava</button>
    <button id="csv" class="secondary" hidden>Données CSV</button>
    <button id="restart" class="secondary" hidden>Nouvelle séance</button>
  </div>
</main>

<footer id="hint"></footer>
</body>
</html>
